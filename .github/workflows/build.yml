# Compiler matrix (ROADMAP 1.6, docs/compilers.md). Each job configures from the matching
# CMakePresets.json preset (the same ones scripts/build.ps1 and the IDEs use) with warnings
# as errors (ROADMAP 1.5), builds every target with MSVC, clang-cl, GCC and Clang, runs the
# DLL-free correctness tests, and runs every Tier A benchmark briefly to prove the perf
# binary executes. Benchmark timings from CI runners are not gated; the gate is the local
# perf.ps1 comparison against a committed baseline.
#
# The game (ROADMAP 2.1, docs/libsm64.md "Continuous integration"): when the LIBSM64_KEY
# repository secret is present (maintainer-only; empty on forks and on pull requests from
# outside, so those steps skip), the Windows jobs and the Ubuntu 26.04 job fetch the pinned
# bitfs-sbb libsm64 build, unlock it into the runner's temp directory, run the libsm64 test
# group on movies/bitfs-pyramid-jp.m64, and gate the Tier C exact counts against the committed
# baselines (scripts/perf_compare.py --counts-only). The unlocked binary never leaves the
# runner. The 24.04 jobs cannot run the Linux .so (it needs glibc 2.43), hence the 26.04
# container job.
#
# Failures are re-emitted as ::error:: annotations so they are readable through the public
# API without downloading logs. On Linux a problem matcher turns compiler warnings into
# annotations too (GitHub keeps at most 10 per step).

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LIBSM64_KEY: ${{ secrets.LIBSM64_KEY }}
  TASFW_M64: movies/bitfs-pyramid-jp.m64
  TASFW_FRAME: "3330"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            preset: msvc-release
            bindir: build/Release
            baseline: perf/baselines/tyler-desktop.json
          - name: windows-clang-cl
            os: windows-latest
            preset: clang-cl-release
            bindir: build/Release-clang
            baseline: perf/baselines/tyler-desktop-clang.json
          - name: ubuntu-gcc
            os: ubuntu-latest
            preset: gcc-release
            bindir: build/Release-gcc
            cxx: g++-13
          - name: ubuntu-clang
            os: ubuntu-latest
            preset: clang-release
            bindir: build/Release-clang
            cxx: clang++-17

    steps:
      - uses: actions/checkout@v5

      # ---------------------------------------------------------------- Linux
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 clang-17 libomp-17-dev
          echo "::add-matcher::.github/matchers/gcc.json"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash   # GitHub's explicit bash shell enables pipefail, so `| tee` cannot hide a failure
        run: |
          cmake --version
          # The preset names the generic g++ / clang++; pin the version the matrix tests.
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DTASFW_WARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | tee build.log

      # -------------------------------------------------------------- Windows
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          $override = @()
          if ('${{ matrix.preset }}' -like 'clang-cl-*') {
            # The preset names clang-cl; on the runner the standalone LLVM is first on PATH and
            # has no OpenMP runtime, so point at the clang-cl that ships with Visual Studio.
            $override = @('-DCMAKE_CXX_COMPILER=' + (Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin\clang-cl.exe'))
          }
          Write-Host "override: $override"
          cmake --preset ${{ matrix.preset }} @override -DTASFW_WARNINGS_AS_ERRORS=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------- Common
      - name: Correctness tests (DLL-free)
        shell: bash
        run: ${{ matrix.bindir }}/out/tasfw-tests

      - name: Tier A benchmarks (every family once, not gated)
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/tasfw-perf --benchmark_filter='^BM_(BinaryStateBin|Scattershot|Inputs|M64|SlotManager|Resource|Script)' --benchmark_min_time=0.01s

      # ------------------------------------------------- The game (Windows, with the key)
      - name: Unlock libsm64 (skipped without the LIBSM64_KEY secret)
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: pwsh
        run: |
          python -m pip install --quiet cryptography
          python scripts/unlock_libsm64.py --key-env LIBSM64_KEY --platform windows --out "$env:RUNNER_TEMP/libsm64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TASFW_LIBSM64=$env:RUNNER_TEMP/libsm64/sm64_jp_0.dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: libsm64 tests (layout checks, golden state at frame 3330, drift test)
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: bash
        run: ${{ matrix.bindir }}/out/tasfw-tests -tc='libsm64*'

      - name: Tier C exact counts against the committed baseline
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/tasfw-perf --benchmark_filter='^BM_Framework' --benchmark_repetitions=1 --benchmark_out=tierc.json --benchmark_out_format=json
          python scripts/perf_compare.py compare ${{ matrix.baseline }} tierc.json --counts-only | grep -v MISSING

      - name: Report failure details as annotations
        if: failure()
        shell: bash
        run: |
          for f in configure.log build.log; do
            if [ -f "$f" ]; then
              echo "::group::$f (errors)"
              grep -inE 'error|warning|fatal|could not|not found|no such' "$f" | head -40 | while IFS= read -r line; do
                echo "::error title=$f::${line}"
              done
              echo "::endgroup::"
            fi
          done
          if [ -f ${{ matrix.bindir }}/CMakeFiles/CMakeConfigureLog.yaml ]; then
            echo "::group::CMakeConfigureLog.yaml (tail)"
            tail -60 ${{ matrix.bindir }}/CMakeFiles/CMakeConfigureLog.yaml | while IFS= read -r line; do
              echo "::error title=CMakeConfigureLog::${line}"
            done
            echo "::endgroup::"
          fi

  # The Linux game path: the bitfs-sbb .so needs glibc 2.43, so this job runs in an Ubuntu
  # 26.04 container with that release's GCC (docs/compilers.md, "GCC and Clang locally").
  # It builds and runs the DLL-free tests unconditionally, so the newest GCC sees every
  # change even without the key.
  ubuntu-26-libsm64:
    name: ubuntu-26.04-gcc-libsm64
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ninja-build g++ cmake git ca-certificates python3 python3-cryptography

      - uses: actions/checkout@v5

      - name: Configure and build
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/gcc.json"
          cmake --version
          cmake --preset gcc-release -DCMAKE_CXX_COMPILER=g++ -DTASFW_WARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log
          cmake --build --preset gcc-release -- -k 0 2>&1 | tee build.log

      - name: Correctness tests (DLL-free)
        run: build/Release-gcc/out/tasfw-tests

      - name: Unlock libsm64 (skipped without the LIBSM64_KEY secret)
        if: env.LIBSM64_KEY != ''
        run: |
          python3 scripts/unlock_libsm64.py --key-env LIBSM64_KEY --platform linux --out "$RUNNER_TEMP/libsm64"
          echo "TASFW_LIBSM64=$RUNNER_TEMP/libsm64/sm64_jp_0.so" >> "$GITHUB_ENV"

      - name: libsm64 tests (layout checks, golden state at frame 3330, drift test)
        if: env.LIBSM64_KEY != ''
        run: build/Release-gcc/out/tasfw-tests -tc='libsm64*'

      - name: Tier C exact counts against the committed baseline
        if: env.LIBSM64_KEY != ''
        run: |
          build/Release-gcc/out/tasfw-perf --benchmark_filter='^BM_Framework' --benchmark_repetitions=1 --benchmark_out=tierc.json --benchmark_out_format=json
          python3 scripts/perf_compare.py compare perf/baselines/tyler-desktop.json tierc.json --counts-only | grep -v MISSING

      - name: Report failure details as annotations
        if: failure()
        run: |
          for f in configure.log build.log; do
            if [ -f "$f" ]; then
              echo "::group::$f (errors)"
              grep -inE 'error|warning|fatal|could not|not found|no such' "$f" | head -40 | while IFS= read -r line; do
                echo "::error title=$f::${line}"
              done
              echo "::endgroup::"
            fi
          done
