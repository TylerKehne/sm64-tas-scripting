# Compiler matrix (ROADMAP 1.6, docs/compilers.md). Each job configures from the matching
# CMakePresets.json preset (the same ones scripts/build.ps1 and the IDEs use) with warnings
# as errors (ROADMAP 1.5), builds every target with MSVC, clang-cl, GCC and Clang, runs the
# DLL-free correctness tests (among them the copied sm64 headers against the pinned DLL's
# DWARF table), checks the copied decomp files against their pinned upstream revision on
# one Linux job (scripts/decomp_diff.py, docs/decomp.md), and runs every Tier A benchmark
# briefly to prove the perf binary executes. Benchmark timings from CI runners are not
# gated; the gate is the local
# perf.ps1 comparison against a committed baseline.
#
# The game (ROADMAP 2.1, docs/libsm64.md "Continuous integration"): when the LIBSM64_KEY
# repository secret is present (maintainer-only; empty on forks and on pull requests from
# outside, so those steps skip), the Windows jobs and the Ubuntu 26.04 jobs fetch the pinned
# bitfs-sbb libsm64 build, unlock it into res/ on the runner, and run everything that is
# exact: the libsm64 test group on movies/bitfs-pyramid-jp.m64, dllcheck's layout checks
# (with fixed-slice coverage on Windows) and a dirty-mode leak scan that must restore every
# byte, the pipeline's dry run (the real config on Windows), the Tier C exact counts and
# the CI-sized Tier D workload's exact counts (perf/tierd-ci*.json) against the committed
# baselines (scripts/perf_compare.py --counts-only). The unlocked binary never leaves the
# runner. The 24.04 jobs cannot run the Linux .so (it needs glibc 2.43), hence the 26.04
# container jobs.
#
# Failures are re-emitted as ::error:: annotations so they are readable through the public
# API without downloading logs. On Linux a problem matcher turns compiler warnings into
# annotations too (GitHub keeps at most 10 per step).

name: build

on:
  pull_request:   # every run tests the merge of the branch into master, the state a merge would produce
  workflow_dispatch:

env:
  LIBSM64_KEY: ${{ secrets.LIBSM64_KEY }}
  TASFW_M64: movies/bitfs-pyramid-jp.m64
  TASFW_FRAME: "3330"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            preset: msvc-release
            bindir: build/Release
            baseline: perf/baselines/tyler-desktop
          - name: windows-clang-cl
            os: windows-latest
            preset: clang-cl-release
            bindir: build/Release-clang
            baseline: perf/baselines/tyler-desktop-clang
          - name: ubuntu-24.04-gcc
            os: ubuntu-24.04
            preset: gcc-release
            bindir: build/Release-gcc
            cxx: g++-14
            # GCC 14.2's LTO link of bitfs-turn fails (docs/compilers.md); GCC 15 (the
            # ubuntu-26.04-gcc job) covers the LTO build.
            cmakeArgs: -DTASFW_LTO=OFF
          - name: ubuntu-24.04-clang
            os: ubuntu-24.04
            preset: clang-release
            bindir: build/Release-clang
            cxx: clang++-18
            cmakeArgs: ''

    steps:
      - uses: actions/checkout@v5

      # The dependency tarballs, cached between runs and fetched with retries before CMake
      # asks for them: GitHub's release and archive downloads return 504 now and then, and
      # FetchContent gives up on the first (scripts/fetch_deps.py).
      - name: Cache the fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('CMakeLists.txt', 'tasfw-tests/CMakeLists.txt', 'tasfw-perf/CMakeLists.txt') }}
      - name: Fetch the dependencies with retries
        shell: bash
        run: |
          py=python3
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; fi
          $py scripts/fetch_deps.py

      # ---------------------------------------------------------------- Linux
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # GCC 14 and Clang 18: the first with C++23's explicit object parameters (deducing
          # this), which the scattershot's per-script movement options use (docs/compilers.md).
          sudo apt-get install -y ninja-build gcc-14 g++-14 clang-18 libomp-18-dev python3-numpy python3-matplotlib
          echo "::add-matcher::.github/matchers/gcc.json"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash   # GitHub's explicit bash shell enables pipefail, so `| tee` cannot hide a failure
        run: |
          cmake --version
          # The preset names the generic g++ / clang++; pin the version the matrix tests.
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DTASFW_WARNINGS_AS_ERRORS=ON ${{ matrix.cmakeArgs }} 2>&1 | tee configure.log

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | tee build.log

      # -------------------------------------------------------------- Windows
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          $override = @()
          if ('${{ matrix.preset }}' -like 'clang-cl-*') {
            # The preset names clang-cl; on the runner the standalone LLVM is first on PATH and
            # has no OpenMP runtime, so point at the clang-cl that ships with Visual Studio.
            $override = @('-DCMAKE_CXX_COMPILER=' + (Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin\clang-cl.exe'))
          }
          Write-Host "override: $override"
          cmake --preset ${{ matrix.preset }} @override -DTASFW_WARNINGS_AS_ERRORS=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------- Common
      - name: Correctness tests (DLL-free)
        shell: bash
        run: ${{ matrix.bindir }}/out/tasfw-tests

      - name: The viewer renders a CSV headless (analysis/visualizer.py --once, ROADMAP 4.4)
        shell: bash
        env:
          TASFW_VISUALIZER_NO_BOOTSTRAP: 1 # the packages come from pip here and apt on Linux, not the viewer's own venv
        run: |
          py=python3
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; $py -m pip install --quiet -r analysis/requirements.txt; fi
          $py analysis/visualizer.py --once --csv tasfw-tests/data/scattershot_sample.csv --out viewer.png
          test -s viewer.png
          # The headless follow mode the perf suite gates (ROADMAP 4.10): a finished run drains on the first tick.
          $py -c "import json; json.dump({'csv': 'tasfw-tests/data/scattershot_sample.csv', 'title': 'ci', 'finished': True, 'rows': 600}, open('ci.visualizer.json', 'w'))"
          TASFW_VISUALIZER_HEADLESS=1 $py analysis/visualizer.py ci.visualizer.json
          test -s ci.visualizer.summary.json && test -s ci.visualizer.png

      - name: Decomp pin (the copied sm64 headers against n64decomp/sm64 at their pinned commits)
        if: matrix.name == 'ubuntu-24.04-gcc'
        shell: bash
        run: python3 scripts/decomp_diff.py

      - name: Tier A benchmarks (every family once, not gated)
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/tasfw-perf --benchmark_filter='^BM_(BinaryStateBin|Scattershot|Inputs|M64|SlotManager|Resource|Script)' --benchmark_min_time=0.01s

      # ------------------------------------------------- The game (Windows, with the key)
      - name: Unlock libsm64 (skipped without the LIBSM64_KEY secret)
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: pwsh
        run: |
          python -m pip install --quiet cryptography
          # 16 copies: config.json's thread count, which the dry run checks for.
          python scripts/unlock_libsm64.py --key-env LIBSM64_KEY --platform windows --out res --copies 16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TASFW_LIBSM64=res/sm64_jp_0.dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: libsm64 tests (layout checks, golden state at frame 3330, drift test)
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: bash
        run: ${{ matrix.bindir }}/out/tasfw-tests -tc='libsm64*'

      - name: dllcheck (layout and fixed-slice coverage; dirty-mode leak scan must restore every byte)
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/dllcheck res/sm64_jp_0.dll movies/bitfs-pyramid-jp.m64 3330 --save-mode fixed
          ${{ matrix.bindir }}/out/dllcheck res/sm64_jp_0.dll movies/bitfs-pyramid-jp.m64 3330 --save-mode dirty --leak-scan | tee dllcheck-dirty.log
          if grep -qE ', [1-9][0-9]* byte\(s\) not restored' dllcheck-dirty.log; then
            echo "::error::a load did not restore every byte the game wrote (see the leak scan above)"
            exit 1
          fi

      - name: Pipeline dry run (the real config's layout check to its first stage)
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: bash
        run: ${{ matrix.bindir }}/out/bitfs-turn --dry-run

      - name: Tier C exact counts against the committed baseline
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/tasfw-perf --benchmark_filter='^BM_Framework' --benchmark_repetitions=3 --benchmark_out=tierc.json --benchmark_out_format=json
          python scripts/perf_compare.py compare ${{ matrix.baseline }} tierc.json --counts-only 2>&1 | grep -v MISSING | tee tierc-compare.log

      - name: Tier D exact counts (CI-sized workload) against the committed baseline
        if: runner.os == 'Windows' && env.LIBSM64_KEY != ''
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/bitfs-turn --config perf/tierd-ci.json | tee tierd-ci.log
          python scripts/perf_compare.py tierd tierd-ci.log -o tierd-ci.json --name TierD_CI --exact
          python scripts/perf_compare.py compare perf/baselines/tierd-ci.json tierd-ci.json --counts-only 2>&1 | tee tierd-compare.log

      - name: Report failure details as annotations
        if: failure()
        shell: bash
        run: |
          for f in configure.log build.log tierc-compare.log tierd-compare.log; do
            if [ -f "$f" ]; then
              echo "::group::$f (errors)"
              grep -inE '\berror\b|fatal error|FAILED|Traceback|REGRESSION|regression[(]s[)]' "$f" | head -40 | while IFS= read -r line; do
                echo "::error title=$f::${line//%/%25}"
              done
              echo "::endgroup::"
            fi
          done
          for f in tierc-compare.log tierd-compare.log; do
            if [ -f "$f" ]; then
              echo "::group::$f (tail)"
              tail -12 "$f" | while IFS= read -r line; do
                echo "::error title=$f tail::${line//%/%25}"
              done
              echo "::endgroup::"
            fi
          done
          if [ -f ${{ matrix.bindir }}/CMakeFiles/CMakeConfigureLog.yaml ]; then
            echo "::group::CMakeConfigureLog.yaml (tail)"
            tail -60 ${{ matrix.bindir }}/CMakeFiles/CMakeConfigureLog.yaml | while IFS= read -r line; do
              echo "::error title=CMakeConfigureLog::${line}"
            done
            echo "::endgroup::"
          fi

  # The Linux game path: the bitfs-sbb .so needs glibc 2.43, so these jobs run in an Ubuntu
  # 26.04 container with that release's GCC and Clang (docs/compilers.md, "GCC and Clang
  # locally"). They build and run the DLL-free tests unconditionally, so the newest
  # compilers see every change even without the key.
  ubuntu-26-libsm64:
    name: ubuntu-26.04-${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cxx: g++
            preset: gcc-release
            bindir: build/Release-gcc
            apt: g++
          - name: clang
            cxx: clang++
            preset: clang-release
            bindir: build/Release-clang
            apt: clang libomp-dev
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ninja-build cmake git ca-certificates python3 python3-cryptography ${{ matrix.apt }}

      - uses: actions/checkout@v5

      - name: Cache the fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('CMakeLists.txt', 'tasfw-tests/CMakeLists.txt', 'tasfw-perf/CMakeLists.txt') }}
      - name: Fetch the dependencies with retries
        shell: bash
        run: python3 scripts/fetch_deps.py

      - name: Configure and build
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/gcc.json"
          cmake --version
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DTASFW_WARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log
          cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | tee build.log

      - name: Correctness tests (DLL-free)
        run: ${{ matrix.bindir }}/out/tasfw-tests

      - name: Unlock libsm64 (skipped without the LIBSM64_KEY secret)
        if: env.LIBSM64_KEY != ''
        run: |
          # 4 copies: the CI-sized Tier D workload's thread count (perf/tierd-ci-linux.json).
          python3 scripts/unlock_libsm64.py --key-env LIBSM64_KEY --platform linux --out res --copies 4
          echo "TASFW_LIBSM64=res/sm64_jp_0.so" >> "$GITHUB_ENV"

      - name: libsm64 tests (layout checks, golden state at frame 3330, drift test)
        if: env.LIBSM64_KEY != ''
        run: ${{ matrix.bindir }}/out/tasfw-tests -tc='libsm64*'

      - name: dllcheck (layout checks; dirty-mode leak scan must restore every byte)
        if: env.LIBSM64_KEY != ''
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/dllcheck res/sm64_jp_0.so movies/bitfs-pyramid-jp.m64 3330 --save-mode dirty --leak-scan | tee dllcheck-dirty.log
          if grep -qE ', [1-9][0-9]* byte\(s\) not restored' dllcheck-dirty.log; then
            echo "::error::a load did not restore every byte the game wrote (see the leak scan above)"
            exit 1
          fi

      - name: Pipeline dry run (the CI config's layout check to its first stage)
        if: env.LIBSM64_KEY != ''
        run: ${{ matrix.bindir }}/out/bitfs-turn --config perf/tierd-ci-linux.json --dry-run

      - name: Tier C exact counts against the committed baseline
        if: env.LIBSM64_KEY != ''
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/tasfw-perf --benchmark_filter='^BM_Framework' --benchmark_repetitions=3 --benchmark_out=tierc.json --benchmark_out_format=json
          python3 scripts/perf_compare.py compare perf/baselines/tyler-desktop tierc.json --counts-only 2>&1 | grep -v MISSING | tee tierc-compare.log

      - name: Tier D exact counts (CI-sized workload) against the committed baseline
        if: env.LIBSM64_KEY != ''
        shell: bash
        run: |
          ${{ matrix.bindir }}/out/bitfs-turn --config perf/tierd-ci-linux.json | tee tierd-ci.log
          python3 scripts/perf_compare.py tierd tierd-ci.log -o tierd-ci.json --name TierD_CI --exact
          python3 scripts/perf_compare.py compare perf/baselines/tierd-ci.json tierd-ci.json --counts-only 2>&1 | tee tierd-compare.log

      - name: Report failure details as annotations
        if: failure()
        run: |
          for f in configure.log build.log tierc-compare.log tierd-compare.log; do
            if [ -f "$f" ]; then
              echo "::group::$f (errors)"
              grep -inE '\berror\b|fatal error|FAILED|Traceback|REGRESSION|regression[(]s[)]' "$f" | head -40 | while IFS= read -r line; do
                echo "::error title=$f::${line//%/%25}"
              done
              echo "::endgroup::"
            fi
          done
